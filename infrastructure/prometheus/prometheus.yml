# Lab scrape config adapted from Java-Sentinel-Security-Observability-Lab.
# Targets use host.docker.internal so the same Prometheus works whether the
# Spring apps run in Compose or under IntelliJ Debug on the host.
# Short intervals make experiments visible within seconds.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: portability-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: portability-api

  - job_name: central-simulator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: central-simulator

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
