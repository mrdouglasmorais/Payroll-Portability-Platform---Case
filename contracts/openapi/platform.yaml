openapi: 3.1.0
info:
  title: Portability API
  version: 0.1.0
  description: |
    Platform contract. Laboratory auth uses HMAC headers toward Central; this API
    currently exposes unauthenticated local operator routes (synthetic data only).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local Portability API
security: []
paths:
  /api/v1/autorizacoes:
    post:
      summary: Request payroll discount authorization
      operationId: createAuthorization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                beneficiarioId: &id001
                  type: string
                  minLength: 1
                convenioId: *id001
              required:
              - beneficiarioId
              - convenioId
              additionalProperties: false
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  autorizacaoId: *id001
                required:
                - autorizacaoId
                additionalProperties: false
        '400':
          description: Invalid request
        '403':
          description: Not authorized
        '409':
          description: Conflict
        '503':
          description: Unavailable
  /api/v1/beneficiarios/{beneficiarioId}/agenda:
    get:
      summary: Sync and list scoped installment agenda
      operationId: getBeneficiaryAgenda
      security: []
      parameters:
      - in: path
        name: beneficiarioId
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    parcelaId: *id001
                    convenioId: *id001
                    valor:
                      type: number
                      multipleOf: 0.01
                    dataDesconto:
                      type: string
                      format: date
                    status: *id001
                  required:
                  - parcelaId
                  - convenioId
                  - valor
                  - dataDesconto
                  - status
                  additionalProperties: false
        '403':
          description: Not authorized
        '404':
          description: Not found
        '503':
          description: Unavailable
  /api/v1/operacoes-portabilidade:
    post:
      summary: Create portability operation
      operationId: createPortabilityOperation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                beneficiarioId: *id001
                parcelas:
                  type: array
                  items: *id001
                  minItems: 1
                  uniqueItems: true
                credorCessionario: *id001
                contaRecebimento:
                  type: object
                  properties:
                    banco: *id001
                    agencia: *id001
                    conta: *id001
                  required:
                  - banco
                  - agencia
                  - conta
                  additionalProperties: false
              required:
              - beneficiarioId
              - parcelas
              - credorCessionario
              - contaRecebimento
              additionalProperties: false
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId: *id001
                required:
                - operationId
                additionalProperties: false
        '400':
          description: Invalid request
        '403':
          description: Not authorized
        '409':
          description: Conflict
        '503':
          description: Unavailable
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema: *id001
  /api/v1/operacoes-portabilidade/{operationId}:
    get:
      summary: Get operation business and processing status
      operationId: getPortabilityOperation
      security: []
      parameters:
      - in: path
        name: operationId
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId: *id001
                  status:
                    type: string
                    enum:
                    - PENDENTE
                    - CONFIRMADA
                    - REJEITADA
                  motivoRejeicao:
                    type:
                    - string
                    - 'null'
                  correlationId: *id001
                  centralProtocol:
                    type:
                    - string
                    - 'null'
                  processing:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - PENDING
                        - RUNNING
                        - RETRYING
                        - SUCCEEDED
                        - REQUIRES_REVIEW
                        - UNKNOWN
                      attemptCount:
                        type: integer
                        minimum: 0
                      errorCode:
                        type:
                        - string
                        - 'null'
                      requiresAction:
                        type: boolean
                    required:
                    - status
                    - attemptCount
                    - errorCode
                    - requiresAction
                    additionalProperties: false
                required:
                - operationId
                - status
                - motivoRejeicao
                - correlationId
                - centralProtocol
                - processing
                additionalProperties: false
        '403':
          description: Not authorized
        '404':
          description: Not found
        '503':
          description: Unavailable
  /api/v1/operacoes-portabilidade/{operationId}/eventos:
    get:
      summary: List append-only operation timeline events
      operationId: listPortabilityOperationEvents
      security: []
      parameters:
      - in: path
        name: operationId
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    eventType: *id001
                    sequence:
                      type: integer
                    occurredAt:
                      type: string
                      format: date-time
                    description: *id001
                  required:
                  - eventType
                  - sequence
                  - occurredAt
                  - description
                  additionalProperties: false
        '403':
          description: Not authorized
        '404':
          description: Not found
        '503':
          description: Unavailable
