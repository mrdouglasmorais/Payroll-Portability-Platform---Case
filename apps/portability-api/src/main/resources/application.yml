server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: portability-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portability}
    username: ${SPRING_DATASOURCE_USERNAME:portability}
    password: ${SPRING_DATASOURCE_PASSWORD:portability}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

app:
  central:
    base-url: ${CENTRAL_BASE_URL:http://localhost:8081}
    hmac-secret: ${CENTRAL_HMAC_SECRET:local-test-hmac-secret}
    hmac-key-id: ${CENTRAL_HMAC_KEY_ID:local-test-key}
    connect-timeout: PT2S
    read-timeout: PT5S
    max-attempts: 8
    poll-delay: PT1S
    lease-duration: PT30S
    worker-enabled: true
    worker-tick: PT1S
