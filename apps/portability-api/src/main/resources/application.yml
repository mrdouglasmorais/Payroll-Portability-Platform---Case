server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 65536
  max-http-request-header-size: 16KB

spring:
  application:
    name: portability-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portability}
    username: ${SPRING_DATASOURCE_USERNAME:portability}
    password: ${SPRING_DATASOURCE_PASSWORD:portability}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  central:
    base-url: ${CENTRAL_BASE_URL:http://localhost:8081}
    hmac-secret: ${CENTRAL_HMAC_SECRET:local-test-hmac-secret}
    hmac-key-id: ${CENTRAL_HMAC_KEY_ID:local-test-key}
    connect-timeout: PT2S
    read-timeout: PT5S
    max-attempts: 8
    poll-delay: PT1S
    lease-duration: PT30S
    worker-enabled: true
    worker-tick: PT1S
