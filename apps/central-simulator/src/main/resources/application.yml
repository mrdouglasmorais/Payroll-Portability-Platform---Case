server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: central-simulator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/central}
    username: ${SPRING_DATASOURCE_USERNAME:central}
    password: ${SPRING_DATASOURCE_PASSWORD:central}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:central-simulator}

logging:
  structured:
    format:
      console: ecs

app:
  hmac-secret: ${CENTRAL_HMAC_SECRET:local-test-hmac-secret}
  hmac-key-id: ${CENTRAL_HMAC_KEY_ID:local-test-key}
  hmac-max-skew: PT5M
  sim:
    confirm-delay: ${CENTRAL_CONFIRM_DELAY:PT2S}
    fault-rate: ${CENTRAL_FAULT_RATE:0}
    fault-seed: ${CENTRAL_FAULT_SEED:42}
