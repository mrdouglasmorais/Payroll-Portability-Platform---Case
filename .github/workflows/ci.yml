name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-portability-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portability-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/portability-api/pom.xml
      - name: Verify portability-api
        run: ./mvnw -B verify

  backend-central-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/central-simulator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/central-simulator/pom.xml
      - name: Verify central-simulator
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  openapi-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate OpenAPI YAML
        run: |
          npx --yes @redocly/cli@1.34.5 lint \
            --config redocly.yaml \
            contracts/openapi/platform.yaml \
            contracts/openapi/central.yaml

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend-portability-api, backend-central-simulator, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: tests/e2e/pnpm-lock.yaml
      - name: Compose up smoke
        run: |
          # Compose substitutes ${VAR:-default}; keep .env present for local parity.
          test -f .env || cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null \
              && curl -sf http://localhost:8081/actuator/health >/dev/null \
              && curl -sf http://localhost:5173 >/dev/null; then
              echo "services healthy (api + central + web)"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:8080/actuator/health
          curl -sf http://localhost:8081/actuator/health
          curl -sf http://localhost:5173 >/dev/null
          ./tests/e2e/dual-stack.sh
        timeout-minutes: 25
      # Fresh Compose volumes keep demo parcels OPEN; do not partially reopen PORTED state.
      # Playwright consumes parcela-ui-* (needs ≥3 OPEN); dual-stack uses other beneficiaries.
      - name: Playwright operator flow and a11y
        working-directory: tests/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test
        timeout-minutes: 15
      - name: Compose down
        if: always()
        run: docker compose down -v

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Full-tree scan avoids gitleaks-action range bugs on root commits
      # (before^..after fails when `before` is the repository's first commit).
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source=/repo --verbose --redact --exit-code=1

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin, javascript-typescript
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Build Java for CodeQL
        run: |
          ./apps/portability-api/mvnw -B -f apps/portability-api/pom.xml -DskipTests package
          ./apps/central-simulator/mvnw -B -f apps/central-simulator/pom.xml -DskipTests package
      - uses: github/codeql-action/analyze@v4

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
